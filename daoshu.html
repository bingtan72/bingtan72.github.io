<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导数的几何意义 · 课堂互动实验室</title><style>
:root{--navy:#142b46;--blue:#2474d2;--red:#d94c54;--green:#1a9d83;--muted:#65758a;--line:#e3eaf1}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--navy)}header{background:linear-gradient(105deg,#12365c,#2379b9);color:#fff;padding:30px max(25px,calc((100vw - 1250px)/2));}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;opacity:.87}.wrap{max-width:1260px;margin:auto;padding:26px 18px 50px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #16395910;overflow:hidden}.card h2{font-size:21px;margin:0;padding:20px 20px 6px}.note{min-height:44px;color:var(--muted);font-size:14px;padding:0 20px 8px;line-height:1.5}canvas{display:block;width:100%;height:285px;touch-action:pan-y}.controls{border-top:1px solid var(--line);background:#fafcfe;padding:13px 20px 17px}.ctl{display:flex;align-items:center;gap:12px;margin:6px 0}.ctl label{width:68px;flex:none;font-size:14px}.ctl input[type=range]{min-width:0;flex:1;accent-color:var(--blue)}.val{width:66px;text-align:right;font:600 15px ui-monospace,monospace}.toolbar{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}button{border:0;background:#e7f1fb;color:#175587;border-radius:9px;padding:8px 15px;font-weight:600;cursor:pointer}button.active{background:#246eb2;color:white}.readout{font-size:14px;color:#3b5067;flex:1;min-width:200px;text-align:right}.legend{font-size:13px;color:#63758b;padding:0 20px 12px}footer{text-align:center;color:var(--muted);padding:30px}.intro{margin:0 0 20px;font-size:16px;line-height:1.7}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}.tabs a{padding:9px 14px;background:#fff;border-radius:9px;text-decoration:none;color:#226ba7;font-weight:bold;border:1px solid #d6e4ef}@media(max-width:860px){.grid{grid-template-columns:1fr}header h1{font-size:25px}}@media print{.card{break-inside:avoid}button{display:none}}
</style></head><body><header><h1>导数的几何意义 · 课堂互动实验室</h1><p>8 组可操作实验 · 滑块拖动 · 自动播放 · 适用于高等数学课堂投屏</p></header><main class="wrap"><p class="intro">操作方法：拖动滑块改变割线位置、观察尺度或切点位置；点击“▶ 自动演示”可连续播放。<b style="color:#d94c54">红色</b>表示切线或导数，<b style="color:#2474d2">蓝色</b>表示原函数或割线，<b style="color:#1a9d83">绿色</b>表示运动点或近似结果。</p><nav class="tabs"><a href="#c0">①割线→切线</a><a href="#c1">②双侧逼近</a><a href="#c2">③以直代曲</a><a href="#c3">④移动切线</a><a href="#c4">⑤切线与法线</a><a href="#c5">⑥绝对值尖点</a><a href="#c6">⑦振荡不可导</a><a href="#c7">⑧可导与连续</a></nav><section class="grid" id="grid"></section></main><footer>导数几何意义 · 可离线使用，不依赖外部网络与数学绘图库</footer><script>
const cfg=[
 {title:'① 割线逐渐变成切线',note:'f(x)=x²，固定 P(1,1)，移动 Q(1+h,(1+h)²)。观察割线斜率怎样逼近 2。',label:'水平增量 h',min:0.02,max:2,step:0.01,init:1.8,read:v=>'割线斜率 = '+(2+v).toFixed(3)+'；切线斜率 = 2',type:0},
 {title:'② 左导数与右导数',note:'同一切点 P(1,1)，从左侧、右侧分别靠近，观察两侧割线的极限。',label:'增量 h',min:-1.3,max:1.3,step:0.01,init:-1.1,read:v=>'割线斜率 = '+(2+v).toFixed(3)+'，目标 = 2',type:1},
 {title:'③ 以直代曲：放大再放大',note:'观察 f(x)=sin(x) 在 a=1 附近。随着观察范围缩小，曲线与切线看起来愈发重合。',label:'观察半径 r',min:0.04,max:3,step:0.01,init:3,read:v=>'观察区间：[1 − '+v.toFixed(2)+'，1 + '+v.toFixed(2)+']',type:2},
 {title:'④ 切点沿曲线移动：导函数',note:'f(x)=sin(x)，移动切点，观察切线斜率由正变零再变负。',label:'切点横坐标 a',min:-3.14,max:3.14,step:0.01,init:-2.8,read:v=>'f′(a)=cos(a)≈'+Math.cos(v).toFixed(3),type:3},
 {title:'⑤ 切线与法线：互相垂直',note:'f(x)=x²。切线斜率 m=2a，法线斜率 −1/m（m≠0）。',label:'切点横坐标 a',min:-1.8,max:1.8,step:0.01,init:1.1,read:v=>'切线 m = '+(2*v).toFixed(2)+'；法线 '+(Math.abs(v)<.02?'竖直':(-1/(2*v)).toFixed(2)),type:4},
 {title:'⑥ |x| 在原点不可导',note:'左右割线分别趋于不同方向：左导数 −1，右导数 +1，所以不可导。',label:'左右距离 h',min:0.04,max:2,step:0.01,init:1.9,read:v=>'左割线斜率 −1；右割线斜率 +1',type:5},
 {title:'⑦ 连续但不可导：斜率振荡',note:'f(x)=x sin(1/x)，f(0)=0。函数在原点连续，但从右侧趋近时割线斜率 sin(1/h) 不收敛。',label:'h (右侧)',min:0.025,max:0.6,step:0.001,init:0.57,read:v=>'割线斜率 sin(1/h) = '+Math.sin(1/v).toFixed(3),type:6},
 {title:'⑧ 分段函数：可导需要斜率相同',note:'f(x)=x² (x≤0)，f(x)=kx (x>0)。调节 k，检验原点的左右导数何时一致。',label:'右侧系数 k',min:-2,max:2,step:0.01,init:1.5,read:v=>'左导数 = 0；右导数 = '+v.toFixed(2)+(Math.abs(v)<.01?'；可导':'；不可导'),type:7}
];
const grid=document.getElementById('grid');const items=[];cfg.forEach((c,i)=>{let card=document.createElement('article');card.className='card';card.id='c'+i;card.innerHTML=`<h2>${c.title}</h2><div class="note">${c.note}</div><canvas></canvas><div class="controls"><div class="ctl"><label>${c.label}</label><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.init}" aria-label="${c.label}"><span class="val"></span></div><div class="toolbar"><button>▶ 自动演示</button><button>↺ 重置</button><div class="readout"></div></div></div>`;grid.appendChild(card);let obj={c,canvas:card.querySelector('canvas'),slider:card.querySelector('input'),value:card.querySelector('.val'),readout:card.querySelector('.readout'),play:card.querySelectorAll('button')[0],reset:card.querySelectorAll('button')[1],playing:false,dir:-1};obj.slider.oninput=()=>{update(obj)};obj.play.onclick=()=>{obj.playing=!obj.playing;obj.play.textContent=obj.playing?'⏸ 暂停':'▶ 自动演示';obj.play.classList.toggle('active',obj.playing)};obj.reset.onclick=()=>{obj.slider.value=c.init;obj.playing=false;obj.play.textContent='▶ 自动演示';obj.play.classList.remove('active');update(obj)};items.push(obj);update(obj)});
function graph(obj){let canvas=obj.canvas,dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);let c=obj.c,v=+obj.slider.value;let xlo=-3,xhi=3,ylo=-2.5,yhi=4.5;if(c.type===0||c.type===1){xlo=-.6;xhi=3.35;ylo=-.8;yhi=6.5}if(c.type===2){xlo=1-v;xhi=1+v;ylo=Math.sin(1)-Math.max(.05,1.25*v);yhi=Math.sin(1)+Math.max(.05,1.25*v)}if(c.type===3){xlo=-4;xhi=4;ylo=-2.2;yhi=2.2}if(c.type===4){xlo=-2.5;xhi=2.5;ylo=-1.5;yhi=5.5}if(c.type===5){xlo=-2.6;xhi=2.6;ylo=-.8;yhi=2.5}if(c.type===6){xlo=-.7;xhi=.7;ylo=-.7;yhi=.7}if(c.type===7){xlo=-2;xhi=2;ylo=-2.5;yhi=2.5}
const L=46,R=18,T=12,B=30,ww=w-L-R,hh=h-T-B,X=x=>L+(x-xlo)/(xhi-xlo)*ww,Y=y=>T+(yhi-y)/(yhi-ylo)*hh;ctx.clearRect(0,0,w,h);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;let ix=Math.pow(10,Math.floor(Math.log10((xhi-xlo)/6)));let sx=[1,2,5,10].find(e=>(xhi-xlo)/(ix*e)<=9)*ix;if(!sx)sx=ix*10;let iy=Math.pow(10,Math.floor(Math.log10((yhi-ylo)/5)));let sy=[1,2,5,10].find(e=>(yhi-ylo)/(iy*e)<=8)*iy;if(!sy)sy=iy*10;for(let x=Math.ceil(xlo/sx)*sx;x<=xhi;x+=sx){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),h-B);ctx.stroke();if(Math.abs(x)>1e-8){ctx.fillStyle='#8c99a9';ctx.font='11px Arial';ctx.fillText(Number(x.toFixed(2)),X(x)-8,h-B+15)}}for(let y=Math.ceil(ylo/sy)*sy;y<=yhi;y+=sy){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(w-R,Y(y));ctx.stroke()}ctx.strokeStyle='#99a8b8';ctx.lineWidth=1.2;if(ylo<0&&yhi>0){ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(w-R,Y(0));ctx.stroke()}if(xlo<0&&xhi>0){ctx.beginPath();ctx.moveTo(X(0),T);ctx.lineTo(X(0),h-B);ctx.stroke()}
function line(fn,color,width=2.3,start=xlo,end=xhi){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();for(let j=0;j<=550;j++){let x=start+(end-start)*j/550,y=fn(x);if(!Number.isFinite(y)){continue}j?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke()};function seg(x1,y1,x2,y2,color,width=2.2,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke();ctx.setLineDash([])}function dot(x,y,col,r=5,text=''){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),r,0,Math.PI*2);ctx.fill();if(text){ctx.font='bold 13px Arial';ctx.fillStyle=col;ctx.fillText(text,X(x)+8,Y(y)-10)}}function lbl(txt,x,y,color){ctx.fillStyle=color;ctx.font='bold 13px sans-serif';ctx.fillText(txt,X(x),Y(y))}
if(c.type===0||c.type===1){let a=1,b=a+v;if(c.type===1&&Math.abs(v)<.015)b=a+.015;line(x=>x*x,'#287ac0',3);line(x=>2*x-1,'#d94c54',2.6);let slope=a+b;line(x=>a*a+slope*(x-a),'#1a9d83',2.4);dot(a,1,'#d94c54',5,'P');dot(b,b*b,'#1a9d83',5,'Q');seg(b,1,b,b*b,'#9cacc0',1.2,[4,4]);lbl('切线',2.5,4.1,'#d94c54')}
if(c.type===2){let a=1;line(Math.sin,'#287ac0',3);line(x=>Math.sin(a)+Math.cos(a)*(x-a),'#d94c54',2.5);dot(a,Math.sin(a),'#1a9d83',5,'P');lbl('曲线',xlo+.06*(xhi-xlo),yhi-.15*(yhi-ylo),'#287ac0');lbl('切线',xlo+.62*(xhi-xlo),ylo+.22*(yhi-ylo),'#d94c54')}
if(c.type===3){line(Math.sin,'#287ac0',3);line(x=>Math.sin(v)+Math.cos(v)*(x-v),'#d94c54',2.5);dot(v,Math.sin(v),'#1a9d83',6,'P');lbl('f(x)=sin x',-3.8,1.75,'#287ac0')}
if(c.type===4){line(x=>x*x,'#287ac0',3);let a=v;line(x=>a*a+2*a*(x-a),'#d94c54',2.4);if(Math.abs(a)<.02)seg(a,ylo,a,yhi,'#1a9d83',2.3);else line(x=>a*a-(x-a)/(2*a),'#1a9d83',2.3);dot(a,a*a,'#172f4e',5,'P');lbl('切线',1.3,4.7,'#d94c54');lbl('法线',-2.1,4.6,'#1a9d83')}
if(c.type===5){line(Math.abs,'#287ac0',3);seg(-v,v,0,0,'#1a9d83',2.5);seg(0,0,v,v,'#d94c54',2.5);dot(-v,v,'#1a9d83',5,'Q₋');dot(v,v,'#d94c54',5,'Q₊');dot(0,0,'#172f4e',5,'O')}
if(c.type===6){let fun=x=>Math.abs(x)<1e-12?0:x*Math.sin(1/x);line(fun,'#287ac0',2.4);line(x=>Math.sin(1/v)*x,'#d94c54',2.2);dot(0,0,'#172f4e',5,'O');dot(v,fun(v),'#1a9d83',5,'Q');lbl('f(x)=x sin(1/x)',-.65,.56,'#287ac0')}
if(c.type===7){line(x=>x*x,'#287ac0',3,xlo,0);line(x=>v*x,'#1a9d83',3,0,xhi);seg(-1,.0,-.01,0,'#d94c54',2.5,[5,5]);dot(0,0,'#172f4e',5,'O');lbl('左支：x²',-1.86,2.0,'#287ac0');lbl('右支：kx',.65,1.9,'#1a9d83')}
}
function update(obj){let v=+obj.slider.value;obj.value.textContent=v.toFixed(obj.c.step<.01?3:2);obj.readout.textContent=obj.c.read(v);graph(obj)}window.addEventListener('resize',()=>items.forEach(graph));let prev=0;function frame(t){if(t-prev>28){items.forEach(o=>{if(!o.playing)return;let c=o.c,v=+o.slider.value;let step=(c.max-c.min)/165;if(c.type===6)step=(c.max-c.min)/280;v+=step*o.dir;if(v<c.min||v>c.max){o.dir*=-1;v=Math.max(c.min,Math.min(c.max,v))}o.slider.value=v;update(o)});prev=t}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
